<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PrintIt Customer App">
  
  <script>
    // Seamless routing for in-store QR scans and deep links
    (function() {
      var path = window.location.pathname;
      if (path && (path.indexOf('/upload-document') !== -1 || path.indexOf('/shop/') !== -1 || path.indexOf('/qr/') !== -1)) {
        if (!window.location.hash) {
          window.location.replace(window.location.origin + '/#' + path + window.location.search);
        }
      }
    })();
  </script>
  
  <!-- Google Sign-In Web Client ID -->
  <meta name="google-signin-client_id" content="322993568107-dpgb4hsmat85kugnbeqjpltrdd4hbn3c.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="print_it_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PrintIt</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Razorpay Online Payments -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- PDF.js library for pdfx web rendering -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/build/pdf.js" type="text/javascript"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/build/pdf.worker.min.js";
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
