<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>PrintIt - Mobile App</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for Custom Colors & Fonts -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appDark: '#080d1a',
            cardDark: '#111827',
            cardBorder: '#1e293b',
            accentCyan: '#06b6d4',
            accentPurple: '#7c3aed',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Custom CSS for Glow Effects and Background Gradients -->
<style data-purpose="custom-background">
    body {
      background-color: #050811;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-viewport {
      background: radial-gradient(circle at 10% 10%, rgba(14, 116, 144, 0.22) 0%, transparent 45%),
                  radial-gradient(circle at 90% 80%, rgba(88, 28, 135, 0.2) 0%, transparent 50%),
                  #070d18;
    }
    .active-nav-glow {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.35);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 selection:bg-cyan-500 selection:text-white">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-sm h-[100dvh] sm:h-[844px] sm:max-h-[900px] app-viewport sm:rounded-[40px] shadow-2xl overflow-hidden flex flex-col relative border border-slate-800/80">
<!-- BEGIN: TopStatusBarAndHeader -->
<header class="pt-5 px-5 pb-3 flex items-center justify-between z-10">
<!-- Theme Switcher Icon -->
<button aria-label="Toggle Theme" class="text-slate-300 hover:text-white transition-colors p-1.5 rounded-full hover:bg-slate-800/50">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="4"></circle>
<path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m14.14-14.14l-1.41 1.41"></path>
</svg>
</button>
<!-- App Logo / Title -->
<h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-1.5">
<span class="">PrintIt</span>
</h1>
<!-- Notifications Icon -->
<button aria-label="Notifications" class="text-slate-300 hover:text-white transition-colors p-1.5 rounded-full hover:bg-slate-800/50 relative">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
</svg>
<span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 bg-cyan-400 rounded-full"></span>
</button>
</header>
<!-- END: TopStatusBarAndHeader -->
<!-- BEGIN: ScrollableContent -->
<main class="flex-1 overflow-y-auto px-5 pb-20 no-scrollbar space-y-5">
<!-- BEGIN: SearchBar -->
<div class="relative mt-1">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full bg-[#111928]/80 text-sm text-slate-200 placeholder-slate-400 pl-10 pr-4 py-2.5 rounded-2xl border border-slate-700/60 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all shadow-inner" placeholder="Find print shops near you..." type="text">
</div>
<!-- END: SearchBar -->
<!-- BEGIN: FilterPills -->
<section class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5" data-purpose="filter-pills">
<!-- Active Filter: Nearby -->
<button class="flex items-center gap-1.5 bg-[#008ba3] text-white px-3.5 py-1.5 rounded-full text-xs font-medium shrink-0 shadow-sm shadow-cyan-900/40">
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
</svg>
<span class="">Nearby</span>
</button>
<!-- Filter: High Rated -->
<button class="flex items-center gap-1.5 bg-[#141b2d] hover:bg-[#1a233a] text-slate-300 border border-slate-700/50 px-3.5 py-1.5 rounded-full text-xs font-medium shrink-0 transition-colors">
<svg class="w-3.5 h-3.5 text-slate-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
</svg>
<span class="">High Rated</span>
</button>
<!-- Filter: Express -->
<button class="flex items-center gap-1.5 bg-[#141b2d] hover:bg-[#1a233a] text-slate-300 border border-slate-700/50 px-3.5 py-1.5 rounded-full text-xs font-medium shrink-0 transition-colors">
<svg class="w-3.5 h-3.5 text-slate-300" fill="currentColor" viewBox="0 0 24 24">
<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
</svg>
<span class="">Express</span>
</button>
</section>
<!-- END: FilterPills -->
<!-- BEGIN: QuickActionsGrid -->
<!-- Updated to three balanced items: Upload, Shops, and Scan QR -->
<section class="grid gap-2.5 pt-1 grid-cols-2" data-purpose="quick-action-cards"><!-- Action 1: Scan QR -->
<div class="flex flex-col items-center gap-2 group cursor-pointer">
<div class="w-full aspect-square rounded-2xl bg-gradient-to-b from-[#132c3f]/80 to-[#0e2133]/90 border border-teal-500/20 flex items-center justify-center shadow-lg group-hover:border-teal-400/50 transition-all duration-200">
<div class="w-9 h-9 rounded-xl bg-teal-500/10 flex items-center justify-center text-teal-300"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="w-6 h-6" fill="none"><rect x="10" y="10" width="18" height="18" rx="5" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"></rect><rect x="16.5" y="16.5" width="5" height="5" rx="1.5" fill="currentColor"></rect><rect x="36" y="10" width="18" height="18" rx="5" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"></rect><rect x="42.5" y="16.5" width="5" height="5" rx="1.5" fill="currentColor"></rect><rect x="10" y="36" width="18" height="18" rx="5" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"></rect><rect x="16.5" y="42.5" width="5" height="5" rx="1.5" fill="currentColor"></rect><path d="M38 36v18h16" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"></path><rect x="46" y="44" width="6" height="4" rx="1.5" fill="currentColor"></rect></svg></div>
</div>
<span class="text-xs font-medium text-slate-200 group-hover:text-teal-300 transition-colors">Scan QR</span>
</div>
<!-- Action 2: Upload -->

<!-- Action 3: Shops -->
<div class="flex flex-col items-center gap-2 group cursor-pointer">
<div class="w-full aspect-square rounded-2xl bg-gradient-to-b from-[#2a1b4e]/80 to-[#1d1438]/90 border border-purple-500/20 flex items-center justify-center shadow-lg group-hover:border-purple-400/50 transition-all duration-200">
<div class="w-9 h-9 rounded-xl bg-purple-500/10 flex items-center justify-center text-purple-400">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M3 3h18v4a3 3 0 01-3 3 3 3 0 01-3-3 3 3 0 01-3 3 3 3 0 01-3-3 3 3 0 01-3-3V3z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M4 10v10a1 1 0 001 1h14a1 1 0 001-1V10" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M10 21v-7h4v7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<span class="text-xs font-medium text-slate-200 group-hover:text-purple-300 transition-colors">Shops</span>
</div></section>
<!-- END: QuickActionsGrid -->
<!-- BEGIN: NearbyShopsSection -->
<section class="pt-2 space-y-3" data-purpose="nearby-shops-list">
<!-- Section Header -->
<div class="flex items-center justify-between">
<h2 class="text-lg font-bold text-white tracking-tight">Nearby Shops</h2>
<button class="text-xs font-medium text-cyan-400 hover:text-cyan-300 transition-colors">See All</button>
</div>
<!-- Shop Card 1: Pr xerox shop -->
<article class="bg-[#121929]/90 border border-slate-700/60 rounded-3xl p-4 shadow-xl relative overflow-hidden backdrop-blur-sm">
<!-- Shop Header & Badges -->
<div class="flex items-start justify-between">
<div>
<h3 class="font-bold text-white text-base leading-snug">Pr xerox shop</h3>
<!-- Shop Location -->
<div class="flex items-center gap-1 text-slate-400 text-xs mt-1">
<svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">pune</span>
</div>
</div>
<!-- Verified Badge -->
<div class="flex items-center gap-1 bg-[#092d3b] text-cyan-300 border border-cyan-500/30 px-2 py-0.5 rounded-full text-[11px] font-medium">
<svg class="w-3 h-3 text-cyan-400 fill-current" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" fill-rule="evenodd"></path>
</svg>
<span class="">Verified</span>
</div>
</div>
<!-- Shop Status & Timings -->
<div class="flex items-center gap-2 text-xs mt-3 text-slate-300">
<span class="inline-block w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]"></span>
<span class="font-medium text-cyan-300">Open Now</span>
<span class="text-slate-500">•</span>
<span class="text-slate-400 text-[11px]">Hours: 09:00 - 18:00</span>
</div>
<!-- Order Now CTA Button -->
<div class="mt-4">
<button class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-[#1798d1] to-[#7154f8] hover:opacity-95 text-white font-semibold text-sm shadow-md shadow-blue-900/30 transition-all flex items-center justify-center">
              Order Now
            </button>
</div>
</article>
<!-- Shop Card 2 (Partially visible): PrintIt Store 1 -->
<article class="bg-[#121929]/90 border border-slate-700/60 rounded-3xl p-4 shadow-xl opacity-90 backdrop-blur-sm">
<div class="flex items-start justify-between">
<div>
<h3 class="font-bold text-white text-base leading-snug">PrintIt Store 1</h3>
<div class="flex items-center gap-1 text-slate-400 text-xs mt-1">
<svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">FC Road, Pune</span>
</div>
</div>
<div class="flex items-center gap-1 bg-[#092d3b] text-cyan-300 border border-cyan-500/30 px-2 py-0.5 rounded-full text-[11px] font-medium">
<svg class="w-3 h-3 text-cyan-400 fill-current" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" fill-rule="evenodd"></path>
</svg>
<span class="">Verified</span>
</div>
</div>
</article>
</section>
<!-- END: NearbyShopsSection -->
</main>
<!-- END: ScrollableContent -->
<!-- BEGIN: BottomNavigationBar -->
<nav class="absolute bottom-0 inset-x-0 bg-[#090f1d]/95 border-t border-slate-800/80 backdrop-blur-md px-6 py-2.5 z-20">
<div class="flex items-center justify-around">
<!-- Tab: Home (Active) -->
<button class="flex flex-col items-center gap-1 group">
<div class="w-9 h-7 rounded-lg bg-[#14324f] text-cyan-400 flex items-center justify-center transition-transform active:scale-95 active-nav-glow">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<rect height="7" rx="1" width="7" x="3" y="3"></rect>
<rect height="7" rx="1" width="7" x="14" y="3"></rect>
<rect height="7" rx="1" width="7" x="14" y="14"></rect>
<rect height="7" rx="1" width="7" x="3" y="14"></rect>
</svg>
</div>
<span class="text-[11px] font-semibold text-cyan-400">Home</span>
</button>
<!-- Tab: Orders -->
<button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition-colors">
<div class="w-9 h-7 flex items-center justify-center">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium">Orders</span>
</button>
<!-- Tab: Profile -->
<button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition-colors">
<div class="w-9 h-7 flex items-center justify-center">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium">Profile</span>
</button>
</div>
</nav>
<!-- END: BottomNavigationBar -->
</div>
<!-- END: MobileDeviceFrame -->






</body></html>
