<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PrintIt - Fast on-demand campus and document printing. Upload documents, customize print settings, pay securely, and collect instantly with zero queue time.">
  <meta name="theme-color" content="#0b1326">
  <meta property="og:title" content="PrintIt - On-Demand Document Printing">
  <meta property="og:description" content="Upload documents, customize print settings, pay securely, and collect instantly with zero queue time.">
  <meta property="og:type" content="website">

  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://checkout.razorpay.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://checkout.razorpay.com" crossorigin>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1326;
      scrollbar-gutter: stable;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    flt-glass-pane {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
  
  <script>
    // Seamless routing for in-store QR scans and deep links
    (function() {
      var path = window.location.pathname;
      if (path && (path.indexOf('/upload-document') !== -1 || path.indexOf('/shop/') !== -1 || path.indexOf('/qr/') !== -1 || path.indexOf('/qr-scanner') !== -1 || path.indexOf('/scan/') !== -1)) {
        if (!window.location.hash) {
          window.location.replace(window.location.origin + '/#' + path + window.location.search);
        }
      }
    })();
  </script>
  
  <!-- Google Sign-In Web Client ID -->
  <meta name="google-signin-client_id" content="322993568107-dpgb4hsmat85kugnbeqjpltrdd4hbn3c.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PrintIt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="shortcut icon" href="favicon.ico"/>

  <title>PrintIt</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Razorpay Online Payments (Deferred to prevent blocking initial load) -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>

  <!-- PDF.js library for pdfx web rendering (Deferred) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/build/pdf.js" type="text/javascript" defer></script>
  <script type="text/javascript">
    window.addEventListener('DOMContentLoaded', function() {
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@2.12.313/build/pdf.worker.min.js";
      }
    });
  </script>
</head>
<body>
  <div id="app-loading-shell" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b1326; z-index: 1000; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
    <img src="assets/logo_cropped.png" alt="PrintIt Logo" style="width: 76px; height: 76px; border-radius: 18px; object-fit: contain; margin-bottom: 20px;" />
    <h1 style="color: #dae2fd; font-size: 26px; font-weight: 700; margin: 0 0 8px 0; letter-spacing: -0.5px; line-height: 1.2;">PrintIt</h1>
    <p style="color: #c7c4d7; font-size: 14px; margin: 0 0 28px 0; max-width: 280px; line-height: 1.4;">Smart On-Demand Campus & Document Printing</p>
    <div style="width: 140px; height: 4px; background: rgba(218, 226, 253, 0.15); border-radius: 9999px; overflow: hidden; position: relative;">
      <div style="width: 40%; height: 100%; background: #51c5f6; border-radius: 9999px; position: absolute; animation: load-bar 1.2s infinite ease-in-out;"></div>
    </div>
  </div>
  <style>
    @keyframes load-bar {
      0% { left: -40%; width: 30%; }
      50% { left: 30%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var shell = document.getElementById('app-loading-shell');
      if (shell) {
        shell.style.transition = 'opacity 0.25s ease';
        shell.style.opacity = '0';
        setTimeout(function() { if (shell.parentNode) shell.parentNode.removeChild(shell); }, 250);
      }
    });
    var observer = new MutationObserver(function() {
      if (document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host')) {
        setTimeout(function() {
          var shell = document.getElementById('app-loading-shell');
          if (shell && shell.parentNode) shell.parentNode.removeChild(shell);
        }, 300);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
